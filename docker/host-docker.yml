# High-trust host Docker access. Enable only when local Docker-daemon
# management from Cookbook is required and you accept that raw socket access
# grants broad control over the host Docker daemon.
#   COMPOSE_FILE=docker-compose.yml:docker/host-docker.yml
#   DOCKER_GID=<numeric host Docker group id>
services:
  odysseus:
    # One-click updates rebuild this container from inside itself via a
    # detached compose CLI. Docker only SIGTERMs PID 1 on stop, so the CLI
    # survives the teardown — but only until the SIGKILL deadline. Give it
    # minutes, not seconds: without this the CLI dies with the old container
    # after the build but before the new one starts, leaving the stack down.
    # Normal stops/restarts are unaffected (exits fast, deadline never hit).
    stop_grace_period: 5m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Project tree for one-click self-updates (_apply_docker managed path):
      # the in-container rebuild needs the same compose file, .env and
      # build context as a host rebuild. The updater additionally requires
      # ODYSSEUS_ENABLE_HOST_DOCKER=true below, so socket presence alone
      # never opts a deployment in.
      - .:/host-project
    group_add: ["${DOCKER_GID:-963}"]
    environment:
      - ODYSSEUS_ENABLE_HOST_DOCKER=true
      # Forward the project name into the container: .env values feed
      # compose interpolation but are never injected, so without this the
      # in-container updater cannot tell which stack to rebuild.
      - COMPOSE_PROJECT_NAME
